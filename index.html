<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pain Service Resources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #1e1a5a; /* Dark blue from newsletter */
        --secondary-color: #f8f8f8; /* Light background */
        --accent-color: #ff7bac; /* Pink accent from newsletter */
        --text-color: #333;
        --card-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        --hover-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--secondary-color);
        color: var(--text-color);
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        background-color: var(--primary-color);
        color: white;
        padding: 30px;
        border-radius: 10px;
        margin-bottom: 30px;
      }

      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }

      .logo-container {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .nhs-container {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .nhs-text {
        color: white;
        font-size: 1rem;
        font-weight: 400;
        text-align: right;
        line-height: 1.4;
      }

      .notebook-icon {
        width: 60px;
        height: 60px;
      }

      .header-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin: 0;
        text-align: left;
      }

      .header-subtitle {
        font-size: 1.5rem;
        font-weight: 400;
        margin: 0;
        text-align: left;
      }

      .nhs-logo {
        width: 100px;
        max-width: 150px;
      }

      .cards-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
        margin-top: 30px;
      }

      .card {
        background-color: white;
        border-radius: 10px;
        box-shadow: var(--card-shadow);
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        position: relative;
        height: 100%;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: var(--hover-shadow);
      }

      .card:hover .card-title {
        color: var(--accent-color);
      }

      .card-content {
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 10px;
        color: var(--primary-color);
        transition: color 0.3s ease;
      }

      .card-description {
        font-size: 0.9rem;
        color: #666;
        flex-grow: 1;
      }

      .card-link {
        text-decoration: none;
        color: inherit;
        display: block;
        height: 100%;
      }

      .card-icon {
        background-color: var(--primary-color);
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 15px;
        font-size: 1.5rem;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 15px;
      }

      .card-header .card-title {
        margin-bottom: 0;
        margin-right: 5px;
        flex: 1;
      }

      .card-header .card-icon {
        margin-bottom: 0;
        flex-shrink: 0;
      }

      .card::after {
        content: "→";
        position: absolute;
        bottom: 20px;
        right: 20px;
        font-size: 1.5rem;
        color: var(--accent-color);
        transition: transform 0.3s ease;
      }

      .card:hover::after {
        transform: translateX(5px);
      }

      .section-title {
        font-size: 2rem;
        color: var(--primary-color);
        margin: 5px 0 20px;
        padding-bottom: 10px;
        border-bottom: 3px solid var(--accent-color);
        display: inline-block;
      }

      footer {
        margin-top: 50px;
        text-align: center;
        padding: 20px;
        background-color: var(--primary-color);
        color: white;
        border-radius: 10px;
      }

      .scroll-indicator {
        display: none; /* Hide by default on desktop */
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      @media (max-width: 768px) {
        header {
          padding: 20px;
        }

        .scroll-indicator {
          display: flex; /* Show on mobile */
          position: fixed;
          bottom: 20px;
          left: 50%;
          transform: translateX(-50%);
          background-color: var(--primary-color);
          width: 40px;
          height: 40px;
          border-radius: 50%;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          box-shadow: var(--card-shadow);
          transition: transform 0.3s ease, background-color 0.3s ease, opacity 0.3s ease;
          z-index: 1000;
          opacity: 1; /* Make visible by default on mobile */
        }

        .scroll-indicator.hidden {
          opacity: 0;
        }

        .scroll-indicator:hover {
          background-color: var(--accent-color);
        }

        .scroll-indicator:active {
          transform: translateX(-50%) scale(0.95);
        }

        .header-content {
          flex-direction: column;
          gap: 30px;
        }

        .header-title {
          font-size: 2.5rem;
          text-align: left;
          line-height: 1;
        }

        .header-subtitle {
          font-size: 1.8rem;
          text-align: left;
        }

        .notebook-icon {
          width: 50px;
          height: 50px;
        }

        .nhs-logo {
          width: 80px;
          height: auto;
        }

        .logo-container {
          width: 100%;
          justify-content: flex-start;
          gap: 30px;
        }

        .header-text {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }

        .nhs-container {
          width: 100%;
          gap: 15px;
        }

        /* Stack cards in a single column */
        .cards-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>

            <img

            </p>

        </div>
      </header>

      <!-- Add scroll indicator -->
      <div class="scroll-indicator" onclick="scrollToBottom()">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 4L12 20M12 20L18 14M12 20L6 14"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div> 

      <script>
        function scrollToBottom() {
          window.scrollTo({
            top: document.documentElement.scrollHeight,
            behavior: "smooth",
          });
        }

        // Add scroll button visibility control
        const scrollIndicator = document.querySelector('.scroll-indicator');
        
        function handleScroll() {
          const windowHeight = window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
          
          // Only hide the button when we're at the bottom of the page
          if (windowHeight + scrollTop >= documentHeight - 20) {
            scrollIndicator.classList.add('hidden');
          } else {
            scrollIndicator.classList.remove('hidden');
          }
        }

        // Add scroll event listener
        window.addEventListener('scroll', handleScroll, { passive: true });
      </script>
